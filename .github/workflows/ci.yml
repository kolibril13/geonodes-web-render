# Lint, test, and build on every push and pull request, so regressions are
# caught before a Pages deploy or an npm publish.
name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build app
        run: npm run build
      - name: Build library
        run: npm run build:lib
