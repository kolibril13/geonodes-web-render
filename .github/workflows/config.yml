# Deploys main to the site root and nodebpy-export to /nodebpy-export/.
# GitHub Pages serves one site per repo, so both branches are built into a
# single combined artifact on every deploy.
name: Deploy static content to Pages

on:
  push:
    branches: ['main', 'nodebpy-export']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main
      - name: Checkout nodebpy-export
        uses: actions/checkout@v6
        with:
          ref: nodebpy-export
          path: nodebpy-export
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: |
            main/package-lock.json
            nodebpy-export/package-lock.json
      - name: Build main
        working-directory: main
        run: |
          npm ci
          npm run build
      - name: Build nodebpy-export
        working-directory: nodebpy-export
        run: |
          npm ci
          npm run build -- --base=/geonodes-web-render/nodebpy-export/
      - name: Combine into one site
        run: |
          mkdir -p site/nodebpy-export
          cp -r main/dist/. site/
          cp -r nodebpy-export/dist/. site/nodebpy-export/
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
